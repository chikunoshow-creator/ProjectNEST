<body>
  <!-- 
    Service Worker の読み込み設定をカスタマイズ。
    既存の flutter_bootstrap.js を使用しつつ、
    アップデートのチェックをキャッシュを通さず行うように指示します。
  -->
  <script>
    // Flutterのブートストラップ設定を拡張
    window.flutterConfig = {
      serviceWorker: {
        // キャッシュをバイパスしてService Workerの更新を確認する
        updateViaCache: 'none',

    };
  </script>
